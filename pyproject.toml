[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor"
version = "0.1.0"
description = "Auditor de websites local, com IA gratuita e interface web, para preparar campanhas de Google Ads e Meta Ads."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "playwright>=1.42",
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["auditor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
