app_name: "Auditor"
owner_services:
  - "Google Ads"
  - "Meta Ads"
  - "Microsoft Advertising"
  - "Tracking e Analytics"
  - "Copy e conversão"

llm:
  backend: ollama
  ollama_url: "http://localhost:11434"
  ollama_keep_alive: "30m"
  num_ctx: 4096
  # Limites do plano gratuito de APIs como o Gemini: pedidos por minuto (fila, nunca falha) e
  # um limite diário aproximado (aviso, controlado nesta sessão - não é uma contagem exacta
  # persistida entre reinícios do servidor).
  requests_per_minute: 8
  daily_limit: 450
  # Texto de cada página enviado ao modelo, em caracteres (protege modelos pequenos/lentos).
  max_page_chars: 4000
  # Preset para quem usa a API gratuita do Gemini em vez do Ollama local (ver README). A
  # chave NUNCA fica aqui - lê-se de AUDITOR_API_KEY no .env. Só é usado quando alguma tarefa
  # (ou o backend global) está definida como "openai_compatible".
  openai_compatible:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
  tasks:
    analise:
      backend: ollama
      model: ""
    keywords:
      backend: ollama
      model: ""
    perfil:
      backend: ollama
      model: ""
    anuncios:
      backend: ollama
      model: ""

crawl:
  max_pages: 25
  delay_seconds: 1.5
  respect_robots: true

tracking:
  pages: 4
  block_collect_requests: true

validation:
  title_case_mode: all_words

  "02.1":
    headlines:
      n: 15
      max: 30
      title_case: true
      unique: true
      forbidden_words: ["já", "stress", "sempre"]
    descriptions:
      n: 4
      min: 85
      max: 90
    sitelinks:
      n: 6
      text_max: 25
      desc_n: 2
      desc_max: 35

  "02.2":
    headlines:
      n: 15
      max: 30
      title_case: true
      unique: true
    long_headlines:
      n: 5
      min: 85
      max: 90
    descriptions:
      n: 5
      min: 85
      max: 90
    sitelinks:
      n: 6
      text_max: 25
      desc_n: 2
      desc_max: 35
      desc_ends_with_period: true

  "02.3":
    headlines:
      n: 15
      max: 30
      title_case: true
      unique: true
    descriptions:
      n: 4
      min: 85
      max: 90
    sitelinks:
      n: 6
      text_max: 25
      desc_n: 2
      desc_max: 35

  "02.4":
    headlines:
      n: 15
      max: 30
      title_case: true
      unique: true
    long_headlines:
      n: 5
      min: 85
      max: 90
    descriptions:
      n: 5
      min: 85
      max: 90
    sitelinks:
      n: 6
      text_max: 25
      desc_n: 2
      desc_max: 35
      desc_ends_with_period: true

  "02.5":
    primary_text:
      n: 3
      preview: 125
    headlines:
      n: 3
      max: 40
    descriptions:
      n: 3
      max: 30

  "02.6":
